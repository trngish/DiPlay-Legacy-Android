plugins {
    id 'com.android.library'
}
android {
    namespace = 'com.shilapi.xcertplay.shared'
    compileSdk = 37

    defaultConfig {
        minSdk = 19
        targetSdk = 37
        multiDexEnabled true

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86'
        }

        externalNativeBuild {
            ndkBuild {
                arguments 'APP_PLATFORM=android-19'
            }
        }

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }
    // NDK r25c is the last supported toolchain that still targets Android 4.4 (API 19).
    ndkVersion = '25.2.9519653'
    externalNativeBuild {
        ndkBuild {
            path = file('src/main/jni/Android.mk')
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
        coreLibraryDesugaringEnabled true
    }
}
dependencies {
    coreLibraryDesugaring libs.desugar.jdk.libs
    implementation 'androidx.annotation:annotation:1.7.1'
    implementation libs.bouncycastle
    implementation libs.jmdns
    // Scaffold for Android 4.4, whose MediaCodec has no Opus at all. This is a third-party prebuilt
    // libopus (no arm64 build), so replace it with a locally built libopus before shipping.
    implementation 'com.droidkit:opus:1.1.1'
    // Pure Java Opus, used when the prebuilt library above cannot be loaded. Needs no native code,
    // so it also works on ABIs the prebuilt library skips entirely.
    implementation 'io.github.jaredmdobson:concentus:1.0.2'
    testImplementation libs.junit
    testImplementation 'org.robolectric:robolectric:4.17'
}
